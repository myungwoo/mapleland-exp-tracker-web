name: Deploy static Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 왜: 검증을 배포와 같은 job에 두면, 하나라도 실패했을 때 절대 배포되지 않습니다.
      # 검사 목록은 CI(ci.yml)와 반드시 같아야 하므로 둘 다 package.json의 `verify` 하나만 부릅니다.
      # 여기에만 검사를 추가하면 PR에서 안 걸리고 배포에서만 터집니다.
      - name: Verify (포맷·타입·린트·자체 테스트)
        run: npm run verify
      - name: Build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # 통합 사이트(mapleland.myungwoo.kr)는 이 리포의 푸시를 감지하지 못한다.
      # 배포가 끝났다고 알려 줘야 그쪽도 최신 코드로 다시 빌드한다.
      # 시크릿이 없으면 조용히 넘어간다(시크릿 등록 전이거나 포크인 경우).
      - name: Notify mapleland-utils
        env:
          TOKEN: ${{ secrets.MAPLELAND_UTILS_DISPATCH }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "MAPLELAND_UTILS_DISPATCH 시크릿이 없어 알리지 않았습니다."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/myungwoo/mapleland-utils/dispatches \
            -d "$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
                  '{event_type:"utils-updated",client_payload:{repo:$repo,sha:$sha}}')"
          echo "mapleland-utils 재빌드를 요청했습니다."
