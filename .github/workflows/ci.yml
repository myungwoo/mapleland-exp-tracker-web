name: CI

# 왜 별도 워크플로인가:
# 배포 워크플로(gh-pages.yml)는 main push에서만 돌기 때문에, PR 단계에서는 아무 검사도 하지 않았습니다.
# 이 워크플로가 PR에서 타입/린트/테스트/빌드를 먼저 확인합니다.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Self-tests (EXP·레벨 픽셀 글꼴 / 레벨 ROI 지문)
        run: npm test
      - name: Build (static export)
        env:
          # 실제 배포와 같은 조건(basePath 포함)으로 빌드해서, 배포 직전에야 드러나는 문제를 미리 잡습니다.
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
